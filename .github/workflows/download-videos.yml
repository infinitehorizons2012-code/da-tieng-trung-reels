name: Download Videos and Update Web App

on:
  repository_dispatch:
    types: [update_videos]
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

permissions:
  contents: write

jobs:
  process-videos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install system dependencies (FFmpeg for yt-dlp)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run video processing script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python scripts/process_videos.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data.js
          # Chỉ commit nếu có sự thay đổi
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update videos from Google Sheet"
          git push
