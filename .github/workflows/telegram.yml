name: Telegram Bot Worker

on:
  repository_dispatch:
    types: [telegram_webhook]
  workflow_dispatch:

jobs:
  process_telegram:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Run Telegram Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          VIDEO_URLS: ${{ toJson(github.event.client_payload.urls) }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          python scripts/add_videos.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data.js video_log.csv || true
          git commit -m "Auto-add new videos from Telegram Webhook" || echo "No changes to commit"
          git push
